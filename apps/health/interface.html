<html>
  <head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
  </head>
  <body>
    <div id="content"></div>

    <script src="../../core/lib/interface.js"></script>
    <script type="module" src="chart.min.js"></script>
    <script>exports = {};</script>
    <script type="module" src="lib.js"></script>
    <script>
const DB_HEADER_LEN = 8;
const DB_RECORDS_PER_HR = 6;
const DB_RECORDS_PER_DAY = DB_RECORDS_PER_HR*24 + 1/*summary*/;

var domContent = document.getElementById("content");

function saveCSV(data, date, title) {
  // date = "2021-9"/ etc
  var csv = "Date,Time,Steps,Heartrate,Movement,Heartrate(min),Heartrate(max),Temperature,Altitude,Activity,Battery\n";
  var f = data;

  var inf = exports.getDecoder(data);
  var idx = DB_HEADER_LEN;
  for (var day=0;day<31;day++) {
    for (var hr=0;hr<24;hr++) { // actually 25, see below
      for (var m=0;m<DB_RECORDS_PER_HR;m++) {
        var h = f.substr(idx, inf.r);
        if (h!=inf.clr) {
          var h = Object.assign({
            day : day + 1,
            hr : hr,
            min : m * 10
          }, inf.decode(h));
          csv += [
            date + "-" + h.day,
            h.hr+":"+h.min.toString().padStart(2,0),
            h.steps,
            h.bpm||"",
            h.movement,
            h.bpmMin||h.bpm||"",
            h.bpmMax||h.bpm||"",
            (h.temperature!==undefined)?h.temperature:"",
            (h.altitude!==undefined)?h.altitude:"",
            (h.activity!==undefined)?h.activity:"",
            (h.battery!==undefined)?h.battery:"",
          ].join(",")+"\n";
        }
        idx += inf.r;
      }
    }
    idx += inf.r; // +1 because we have an extra record with totals for the end of the day
  }

  Util.saveCSV(title, csv);
}

function downloadHealth(filename, callback) {
  Util.showModal("Downloading Health info...");
  Util.readStorage(filename, data => {
    Util.hideModal();
    callback(data);
  });
}
function getMonthList() {
  destroyCharts();
  Util.showModal("Loading...");
  domContent.innerHTML = "";
  Puck.eval(`require("Storage").list(/^health-.*\\.raw$/)`,files=>{
    files = files.map(f => {
      var m = f.match(/^health-([^\.]+)\.raw$/);
      var [year, month] = m[1].split("-");
      return {
        filename : f,
        date : m[1], // eg "2021-9"
        str : new Date(year, month-1).toLocaleString(undefined, {month:'long',year:'numeric'})
      }
    })
    var htmlOverview = `<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Month</th>
      <th></th>
    </tr>
  </thead>
  <tbody>\n`;
    files.forEach(f => {
      htmlOverview += `
      <tr>
        <td>${f.str}</td>
        <td>
          <button class="btn btn-primary" filename="${f.filename}" date="${f.date}" task="downloadcsv">Download CSV</button>
          <button class="btn btn-primary" filename="${f.filename}" date="${f.date}" monthstr="${f.str}" task="monthtable">Table</button>
          <button class="btn btn-primary" filename="${f.filename}" date="${f.date}" monthstr="${f.str}" task="monthgraph">Graph</button>
          <button class="btn btn-error" filename="${f.filename}" date="${f.date}" task="delete" style="float: right;margin-right: 5px;">Delete</button>
        </td>
      </tr>
      `;
    });
    if (files.length==0) {
      htmlOverview += `
    <tr>
      <td>No data recorded</td>
      <td></td>
    </tr>
        `;
    }
    htmlOverview += `
    </tbody>
</table>`;
    domContent.innerHTML = htmlOverview;
    Util.hideModal();
    var buttons = domContent.querySelectorAll("button");
    for (var i=0;i<buttons.length;i++) {
      buttons[i].addEventListener("click",event => {
        var button = event.currentTarget;
        var filename = button.getAttribute("filename");
        var date = button.getAttribute("date");
        if (!filename || !date) return;
        var monthstr = button.getAttribute("monthstr");
        var task = button.getAttribute("task");
        if (task=="delete") {
          Util.showModal("Deleting...");
          Util.eraseStorage(filename,()=>{
            Util.hideModal();
            getMonthList();
          });
        }
        if (task=="downloadcsv") {
          downloadHealth(filename, data => saveCSV(data, date, `Bangle.js Health ${date}`));
        }
        if (task=="monthtable") {
          viewMonthDataAsTable(filename, date, monthstr);
        }
        if (task=="monthgraph") {
          viewMonthDataAsGraph(filename, date, monthstr);
        }
      });
    }
  })
}

function getDailyData(data) {
  var dailyData = [];
  var inf = exports.getDecoder(data);
  var idx = DB_HEADER_LEN;
  for (var day = 0; day < 31; day++) {
    var dayData = {steps: 0, bpm: 0, movement: 0};
    let bpmCnt = 0;
    for (var hr = 0; hr < 24; hr++) { // actually 25, see below
      for (var m = 0; m < DB_RECORDS_PER_HR; m++) {
        var h = data.substr(idx, inf.r);
        if (h != inf.clr) {
          var h = Object.assign({
            day : day + 1,
            hr : hr,
            min : m * 10
          }, inf.decode(h));
          dayData.steps += h.steps; // sum
          if (h.bpm > 0) {
            dayData.bpm = dayData.bpm + h.bpm;
            bpmCnt++;
          }
          dayData.movement += h.movement; // sum
        }
        idx += inf.r;
      }
    }
    idx += inf.r; // +1 because we have an extra record with totals
                          // for the end of the day
    if (bpmCnt > 0) {
      dayData.bpm = Math.round(dayData.bpm/bpmCnt); // average
    }
    dailyData[day + 1] = dayData;
   }
   return dailyData;
}

function getHourlyData(data, day) {
  // day = 1..31. Returns an array indexed by hour, with undefined
  // for hours where nothing was recorded
  var hourlyData = [];
  var inf = exports.getDecoder(data);
  var idx = DB_HEADER_LEN + (day - 1) * DB_RECORDS_PER_DAY * inf.r;
  for (var hr = 0; hr < 24; hr++) {
    let hrData;
    let bpmCnt = 0;
    for (var m = 0; m < DB_RECORDS_PER_HR; m++) {
      var h = data.substr(idx, inf.r);
      if (h != inf.clr) {
        h = inf.decode(h);
        if (!hrData) hrData = {steps: 0, bpm: 0, movement: 0};
        hrData.steps += h.steps; // sum
        if (h.bpm > 0) {
          hrData.bpm += h.bpm;
          bpmCnt++;
        }
        hrData.movement += h.movement; // sum
      }
      idx += inf.r;
    }
    if (bpmCnt > 0) {
      hrData.bpm = Math.round(hrData.bpm/bpmCnt); // average
    }
    hourlyData[hr] = hrData;
  }
  return hourlyData;
}

function getDaysInMonth(date) {
  // date = "2021-9"/ etc
  var [year, month] = date.split("-");
  return new Date(year, month, 0).getDate();
}

var charts = [];

function destroyCharts() {
  charts.forEach(chart => chart.destroy());
  charts = [];
}

function drawBarChart(canvasId, labels, label, data, onClickLabel) {
  var options = {
    scales: {
      y: {
        beginAtZero: true
      }
    }
  };
  if (onClickLabel) {
    // find the bar under the cursor, even if it is very short (or zero)
    var getBars = (event, chart) => chart.getElementsAtEventForMode(event, 'index', {intersect: false}, false);
    options.onClick = (event, elements, chart) => {
      var bars = getBars(event, chart);
      // defer, as onClickLabel destroys this chart while Chart.js is still handling the event
      if (bars.length) setTimeout(() => onClickLabel(labels[bars[0].index]));
    };
    options.onHover = (event, elements, chart) => {
      event.native.target.style.cursor = getBars(event, chart).length ? "pointer" : "default";
    };
  }
  charts.push(new Chart(document.getElementById(canvasId), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: label,
        data: data,
        borderWidth: 1
      }]
    },
    options: options
  }));
}

function viewMonthDataAsTable(filename, date, monthstr) {
  Util.showModal("Reading Health info...");
  Util.readStorage(
    filename, data => {
      Util.hideModal();
      showMonthDataAsTable(data, date, monthstr);
    });
}

function showMonthDataAsTable(data, date, monthstr) {
  destroyCharts();
  var htmlOverview = `<h1>` + monthstr + `</ h1>
  <button class="btn btn-primary" id="backtomonth" style="float: right;margin-right: 5px;">Back</button>
  <p style="font-size:50%;">Click on a day to view hourly data</p>
  <table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Day</th>
      <th>Steps</th>
      <th>BPM</th>
      <th>Movement</th>
    </tr>
  </thead>
  <tbody>\n`;

  var dailyData = getDailyData(data);
  var daysInMonth = getDaysInMonth(date);
  for (var i = 1; i <= daysInMonth; i++) {
    var dayData = dailyData[i];
    if (dayData) {
      htmlOverview += `<tr day="${i}" style="cursor:pointer;">
      <td>${i}</td>
      <td>${dayData.steps}</td>
      <td>${Math.round(dayData.bpm)}</td>
      <td>${dayData.movement}</td></tr>`
    }
  }
  htmlOverview += `</tbody></table>`;
  domContent.innerHTML = htmlOverview;
  domContent.querySelector("#backtomonth").addEventListener("click",event => {
    getMonthList();
  });
  domContent.querySelectorAll("tr[day]").forEach(row => {
    row.addEventListener("click",event => {
      var day = parseInt(event.currentTarget.getAttribute("day"));
      showDayData(data, date, monthstr, day, "table");
    });
  });
}

function viewMonthDataAsGraph(filename, date, monthstr) {
  Util.showModal("Reading Health info...");
  Util.readStorage(
    filename, data => {
      Util.hideModal();
      showMonthDataAsGraph(data, date, monthstr);
    });
}

function showMonthDataAsGraph(data, date, monthstr) {
  destroyCharts();
  var html = `<h1>` + monthstr + `</ h1>
  <button class="btn btn-primary" id="backtomonth" style="float: right;margin-right: 5px;">Back</button>
  <p style="font-size:50%;">Click on a day to view hourly data</p>
  <h2>Steps</h2>
  <canvas id="chartSteps"></canvas>
  <h2>BPM</h2>
  <canvas id="chartBPM"></canvas>
  <h2>Movement</h2>
  <canvas id="chartMovement"></canvas>`
  domContent.innerHTML = html;
  domContent.querySelector("#backtomonth").addEventListener("click",event => {
    getMonthList();
  });

  var labels = [];
  var dataSteps = [], dataBPM = [], dataMovement = [];

  var dailyData = getDailyData(data);
  var daysInMonth = getDaysInMonth(date);
  for (var i = 1; i <= daysInMonth; i++) {
    var dayData = dailyData[i];
    if (dayData) {
      labels.push(i);
      dataSteps.push(dayData.steps);
      dataBPM.push(dayData.bpm);
      dataMovement.push(dayData.movement);
    }
  }

  var onClickDay = day => showDayData(data, date, monthstr, day, "graph");
  drawBarChart("chartSteps", labels, '# of steps', dataSteps, onClickDay);
  drawBarChart("chartBPM", labels, 'Beats per minute', dataBPM, onClickDay);
  drawBarChart("chartMovement", labels, 'Movement', dataMovement, onClickDay);
}

function showDayData(data, date, monthstr, day, view) {
  // view = "table" or "graph", the month view we came from
  destroyCharts();
  var [year, month] = date.split("-");
  var daystr = new Date(year, month-1, day).toLocaleString(undefined, {day:'numeric',month:'long',year:'numeric'});
  var daysInMonth = getDaysInMonth(date);
  var html = `<h1>` + daystr + `</ h1>
  <button class="btn btn-primary" id="backtomonth" style="float: right;margin-right: 5px;">Back</button>
  <button class="btn" id="nextday" style="float: right;margin-right: 5px;"${day>=daysInMonth?" disabled":""}>Next day</button>
  <button class="btn" id="prevday" style="float: right;margin-right: 5px;"${day<=1?" disabled":""}>Previous day</button>\n`;

  var hourlyData = getHourlyData(data, day);
  var hours = [];
  for (var hr = 0; hr < 24; hr++) hours.push(hr.toString().padStart(2,0)+":00");

  if (view=="graph") {
    html += `
  <h2>Steps</h2>
  <canvas id="chartSteps"></canvas>
  <h2>BPM</h2>
  <canvas id="chartBPM"></canvas>
  <h2>Movement</h2>
  <canvas id="chartMovement"></canvas>`;
  } else {
    html += `<table class="table table-striped table-hover">
  <thead>
    <tr>
      <th>Hour</th>
      <th>Steps</th>
      <th>BPM</th>
      <th>Movement</th>
    </tr>
  </thead>
  <tbody>\n`;
    var hasData = false;
    hourlyData.forEach((hrData, hr) => {
      if (!hrData) return;
      hasData = true;
      html += `<tr>
      <td>${hours[hr]}</td>
      <td>${hrData.steps}</td>
      <td>${hrData.bpm}</td>
      <td>${hrData.movement}</td></tr>`;
    });
    if (!hasData) {
      html += `<tr>
      <td>No data recorded</td>
      <td></td>
      <td></td>
      <td></td></tr>`;
    }
    html += `</tbody></table>`;
  }
  domContent.innerHTML = html;

  var showMonth = () => {
    if (view=="graph") showMonthDataAsGraph(data, date, monthstr);
    else showMonthDataAsTable(data, date, monthstr);
  };
  domContent.querySelector("#backtomonth").addEventListener("click",event => showMonth());
  domContent.querySelector("#prevday").addEventListener("click",event => {
    showDayData(data, date, monthstr, day-1, view);
  });
  domContent.querySelector("#nextday").addEventListener("click",event => {
    showDayData(data, date, monthstr, day+1, view);
  });

  if (view=="graph") {
    // use null for hours with no data so they are left blank
    var getHourly = key => hourlyData.map(hrData => hrData ? hrData[key] : null);
    drawBarChart("chartSteps", hours, '# of steps', getHourly("steps"));
    drawBarChart("chartBPM", hours, 'Beats per minute', getHourly("bpm"));
    drawBarChart("chartMovement", hours, 'Movement', getHourly("movement"));
  }
}

function onInit() {
  getMonthList();
}

    </script>
  </body>
</html>
