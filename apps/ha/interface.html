<html>
  <head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
  </head>
  <body>
    <h3>Home Assistant trigger config</h3>
    <div class="form-group" style="max-width:500px">
      <label class="form-label" for="webhookUrl">Webhook URL (optional, leave empty to use Android Companion broadcasts)</label>
      <input id="webhookUrl" class="form-input" type="url" placeholder="http://homeassistant.local:8123/api/webhook/bangle_ha">
    </div>
    <p><textarea id="triggers" style="width:500px; height:300px">
[
  {"display": "Open", "trigger": "OPEN_DOOR", "icon":"door"},
  {"display": "Office", "trigger": "TOGGLE_LIGHT", "icon":"light"},
  {"display": "Living Room", "trigger": "OVEN", "icon":"fire"}
]</textarea></p>
    <p><button id="upload" class="btn btn-primary">Upload trigger</button></p>

    <script src="../../core/lib/interface.js"></script>

    <script>
       function onInit(){
          /*
          * Load trigger and optional webhook config from Bangle.js
          */
          console.log("Loading trigger from Bangle.js...");
          try {
            Util.readStorage("ha.trigger.json", data=>{
              if (data && data.length > 0) {
                document.getElementById("triggers").value = data;
                console.log("Loaded trigger from Bangle.js.");
              }
            });
            Util.readStorageJSON("ha.json", cfg=>{
              if (cfg && typeof cfg.webhookUrl === "string") {
                document.getElementById("webhookUrl").value = cfg.webhookUrl;
              }
            });
          } catch(ex) {
              console.log("(Warning) Could not load trigger from Bangle.js.");
              console.log(ex);
          }
        }

        /*
         * Upload trigger to Bangle.js
         */
        document.getElementById("upload").addEventListener("click", function() {
            var triggerText = document.getElementById("triggers").value;
            var webhookUrl = document.getElementById("webhookUrl").value.trim();
            try {
              JSON.parse(triggerText);
            } catch (ex) {
              alert("Invalid trigger JSON: " + ex.message);
              return;
            }

            Util.showModal("Saving...");
            Util.writeStorage("ha.trigger.json", triggerText, ()=>{
              if (webhookUrl) {
                Util.writeStorage("ha.json", JSON.stringify({webhookUrl: webhookUrl}), ()=>{
                  Util.hideModal();
                });
              } else {
                Util.eraseStorage("ha.json", ()=>{
                  Util.hideModal();
                });
              }
            });
            console.log("Sent ha.trigger.json!");
        });

    </script>
  </body>
</html>
