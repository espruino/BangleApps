<html>
  <head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.0.3/dist/leaflet.css" />
    <link rel="stylesheet" href="../../css/spectre.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.6.0/dist/geosearch.css"/>
  </head>
    <style>
      body {
        padding: 0;
        margin: 0;
      }
      html, body, #map, #mapsLoaded, #mapContainer {
        position: relative;
        height: 100%;
        width: 100%;
      }
      #map { z-index: 1; }
      #controls {
        padding: 10px;
        margin: 10px;
        border: 1px solid black;
        position:absolute;
        right:0px;top:0px;
        background-color: rgb(255, 255, 255);
        z-index: 100;
      }
      #maptiles {
        width: 256px;
        height: 256px;
      }
      .tile-title {
        font-weight:bold;
        font-size: 125%;
      }
      .tile-map {
        width: 128px;
        height: 128px;
      }
    </style>
  </head>
  <body>
    <div id="mapsLoadedContainer">
    </div>
    <div id="mapContainer">
      <div id="map">
      </div>
      <div id="controls">
        <div class="form-group" style="display:inline-block;">
          <select class="form-select" id="mapMode">
            <option value="area" selected>Map area</option>
            <option value="route">GPX route</option>
          </select>
        </div>
        <div class="form-group" style="display:inline-block;">
          <select class="form-select" id="mapStyle">
            <option value="3bit" selected>3 bit</option>
            <option value="8bit">8 bit</option>
            <option value="1bit">1 bit</option>
          </select>
        </div>
        <span id="areacontrols">
        <div class="form-group" style="display:inline-block;">
          <select class="form-select" id="mapSize">
            <option value="4">Small (4x4)</option>
            <option value="5" selected>Medium (5x5)</option>
            <option value="7">Large (7x7)</option>
            <option value="10">XL (10x10)</option>
            <option value="15">XXL (15x15)</option>
          </select>
        </div>
        <button id="getmap" class="btn btn-primary">Get Map</button>
        </span>
        <span id="routecontrols" style="display:none">
          <input type="file" id="gpxFile" accept=".gpx" style="display:none"/>
          <button class="btn" onclick="document.getElementById('gpxFile').click()">Load GPX</button>
        </span>
        <button class="btn" onclick="showLoadedMaps()">Map List</button><br/>
        <span id="routeoptions" style="display:none">
          <div class="form-group" style="display:inline-block;">
            <select class="form-select" id="routeRadius">
              <option value="250">Route &plusmn;250m</option>
              <option value="500" selected>Route &plusmn;500m</option>
              <option value="1000">Route &plusmn;1km</option>
              <option value="2000">Route &plusmn;2km</option>
            </select>
          </div>
          <div class="form-group" style="display:inline-block;">
            <select class="form-select" id="routeDetail">
              <option value="14">Low detail</option>
              <option value="15" selected>Medium detail</option>
              <option value="16">High detail</option>
              <option value="17">Very high detail</option>
            </select>
          </div>
          <button id="getroute" class="btn btn-primary">Get Route</button><br/>
          <span id="routestats"></span>
        </span><br/>
        <canvas id="maptiles" style="display:none"></canvas>
        <div id="uploadbuttons" style="display:none"><button id="upload" class="btn btn-primary">Upload</button>
        <button id="cancel" class="btn">Cancel</button>
        <span id="mapstats"></span></div>
      </div>
    </div>

    <script src="../../core/lib/interface.js"></script>
    <script src="https://unpkg.com/leaflet@1.0.3/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="../../webtools/heatshrink.js"></script>
    <script src="../../webtools/imageconverter.js"></script>
    <script src="https://unpkg.com/leaflet-geosearch@3.6.0/dist/bundle.min.js"></script>
    <script src="imagefilter.js"></script>
    <script src="gpx.js"></script>
    <script src="routeplan.js"></script>
    <script>
    /*

TODO:

* Could maybe use palettised output?
* Could potentially use a custom 16 color palette?
* Allow user to choose size of map area to be uploaded (small/med/large)
* What is faster? Storing as a compressed image and decompressing, or storing decompressed?

    */
      var TILESIZE = 96; // Size of our tiles
      var OSMTILESIZE = 256; // Size of openstreetmap tiles
      /* Can see possible tiles on http://leaflet-extras.github.io/leaflet-providers/preview/
      However some don't allow cross-origin use */
      //var TILELAYER = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png'; // simple, high contrast, TOO SLOW
      //var TILELAYER = 'http://a.tile.stamen.com/toner/{z}/{x}/{y}.png'; // black and white
      var TILELAYER = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
      var PREVIEWTILELAYER = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

      MAPSTYLES = {
        "3bit" : {
          layer : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
          attribution: 'Map data &copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors</a>',
          img : { compression:false, output:"raw", mode:"3bit",diffusion:"bayer2"}
        }, "8bit" : {
          layer : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
          attribution: 'Map data &copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors</a>',
          img : { compression:false, output:"raw", mode:"web" }
        }, "1bit" : {
          layer : 'https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png',
          attribution: '&copy; <a href="https://www.stadiamaps.com/" target="_blank">Stadia Maps</a> &copy; <a href="https://www.stamen.com/" target="_blank">Stamen Design</a> &copy; <a href="https://openmaptiles.org/" target="_blank">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          img : { compression:false, output:"raw", mode:"1bit",inverted:true }
        }
      };

      var loadedMaps = [];

      // Tiles used for Bangle.js itself
      var bangleTileLayer;
      // Tiles used for the may the user sees (faster)
      var previewTileLayer;
      // Currently selected version of MAPSTYLES
      var currentStyle;

      // Could optionally overlay trails: https://wiki.openstreetmap.org/wiki/Tiles


      function createMapLayers(style) {
        currentStyle = style;
        bangleTileLayer = L.tileLayer(style.layer, {
          maxZoom: 18,
          attribution: style.attribution
        });
        previewTileLayer = L.tileLayer(style.layer, {
          maxZoom: 18,
          attribution: style.attribution
        });
      }
      createMapLayers(MAPSTYLES["3bit"]);

      // Create map and try and set the location to where the browser thinks we are
      var map = L.map('map').locate({setView: true, maxZoom: 16, enableHighAccuracy:true});
      previewTileLayer.addTo(map);

      // Search box:
      const searchProvider = new window.GeoSearch.OpenStreetMapProvider();
      const searchControl = new GeoSearch.GeoSearchControl({
        provider: searchProvider,
        style: 'button',
        updateMap: true,
        autoClose: true,
        showMarker: false,
        keepResult: true,
        autoComplete: false
      });
      map.addControl(searchControl);

      // ---------------------------------------- Run at startup
      function onInit(device) {
        if (device && device.info && device.info.g) {
          // On 3 bit devices, 3 bit is the best way
          // still allow 8 bit as it makes zoom out much nicer
          // ... but lets just default to 3 bit anyway now
          /*if (device.info.g.bpp==3) {
            document.getElementById("3bit").checked = true;
            //document.getElementById("3bitdiv").style = "display:none";
          }*/
        }

        showLoadedMaps();
      }

      function showLoadedMaps() {
        document.getElementById("mapsLoadedContainer").style.display = "";
        document.getElementById("mapContainer").style.display = "none";

        Util.showModal("Loading maps...");
        let mapsLoadedContainer = document.getElementById("mapsLoadedContainer");
        mapsLoadedContainer.innerHTML = "";
        loadedMaps = [];
        const mapsLoaded = [];

        Puck.eval(`require("Storage").list(/openstmap\\.\\d+\\.json/)\n`,function(files) {
          console.log("MAPS:",files);
          files.sort();
          let promise = Promise.resolve();
          files.forEach(filename => {
            if (filename=="") return;
            promise = promise.then(() => new Promise(resolve => {
              Util.readStorageJSON(filename, mapInfo => {
                console.log(filename + " => " + JSON.stringify(mapInfo));
                let mapNumber = filename.match(/\d+/)[0]; // figure out what map number we are
                loadedMaps[mapNumber] = mapInfo;
                if (mapInfo!==undefined)
                  mapsLoaded.push({mapNumber: mapNumber, mapInfo: mapInfo});
                resolve();
              });
            }));
          });
          promise = promise.then(() => new Promise(resolve => {
            const entries = mapListEntries(mapsLoaded);
            entries.forEach((entry, idx) => {
              const tiles = entry.maps.reduce((r,m) => r + m.mapInfo.w*m.mapInfo.h, 0);
              const kBytes = entry.maps.reduce((r,m) => r + (m.mapInfo.kBytes || (m.mapInfo.imgx*m.mapInfo.imgy*3)>>13), 0);
              const mapNumbers = entry.maps.map(m => m.mapNumber);
              mapsLoadedContainer.innerHTML += `
<div class="tile">
  <div class="tile-icon">
    <div class="tile-map" id="tile-map-${idx}">
    </div>
  </div>
  <div class="tile-content">
    <p class="tile-title">${entry.title}</p>
    <p class="tile-subtitle">${tiles} Tiles (${kBytes}k)</p>
  </div>
  <div class="tile-action">
    <button class="btn btn-primary" onclick="onMapDelete([${mapNumbers}])">Delete</button>
  </div>
</div>
              `;
            });
            setTimeout(() => {
              entries.forEach((entry, idx) => {
                let map = L.map(`tile-map-${idx}`);
                L.tileLayer(PREVIEWTILELAYER, {
                  maxZoom: 18
                }).addTo(map);
                const bounds = entry.maps.map(m => {
                  const dist = m.mapInfo.scale * m.mapInfo.tilesize * m.mapInfo.w;
                  return L.latLng(m.mapInfo.lat, m.mapInfo.lon).toBounds(dist/2/*meters*/);
                }).reduce((all, b) => all.extend(b));
                new L.marker(L.latLng(entry.maps[0].mapInfo.lat, entry.maps[0].mapInfo.lon)).addTo(map);
                map.fitBounds(bounds, {animation: false});
              });
            }, 0);

            resolve();
          }));
          promise = promise.then(() => new Promise(resolve => {
            if (!loadedMaps.length) {
              mapsLoadedContainer.innerHTML += `
<div class="tile">
<div class="tile-icon">
<div class="tile-map">
</div>
</div>
<div class="tile-content">
<p class="tile-title">No Maps Loaded</p>
</div>
<div class="tile-action">
</div>
</div>
              `;
            }
            mapsLoadedContainer.innerHTML += `
<div class="tile">
<div class="tile-icon">
  <div class="tile-map">
  </div>
</div>
<div class="tile-content">
</div>
<div class="tile-action">
<button class="btn btn-primary" onclick="showMap()">Add Map</button>
</div>
</div>
            `;
              Util.hideModal();
          }));
        });
      }

      // Maps uploaded for the same route are listed (and deleted) together
      function mapListEntries(mapsLoaded) {
        const entries = [];
        const routeEntries = {};
        mapsLoaded.forEach(mapLoaded => {
          const route = mapLoaded.mapInfo.route;
          if (!route) {
            entries.push({title: `Map ${mapLoaded.mapNumber}`, maps: [mapLoaded]});
          } else {
            if (!routeEntries[route])
              entries.push(routeEntries[route] = {title: `Route ${route}`, maps: []});
            routeEntries[route].maps.push(mapLoaded);
          }
        });
        return entries;
      }

      function onMapDelete(mapNumbers) {
        console.log("delete", mapNumbers);
        Util.showModal(`Erasing map ${mapNumbers.join(", ")}...`);
        let promise = Promise.resolve();
        mapNumbers.forEach(mapNumber => {
          ["json", "img"].forEach(ext => {
            promise = promise.then(() => new Promise(resolve => {
              Util.eraseStorage(`openstmap.${mapNumber}.${ext}`, resolve);
            }));
          });
        });
        promise.then(() => {
          Util.hideModal();
          showLoadedMaps();
        });
      }

      function showMap() {
        document.getElementById("mapsLoadedContainer").style.display = "none";
        document.getElementById("mapContainer").style.display = "";
        document.getElementById("maptiles").style.display="none";
        document.getElementById("uploadbuttons").style.display="none";
        map.invalidateSize();
        if (isRouteMode() && route) {
          map.fitBounds(route.bounds);
          getStorageFree().then(free => {
            storageFree = free;
            showRoutePlan();
          });
        } else {
          map.locate({setView: true, maxZoom: 16, enableHighAccuracy:true});
        }
      }

      // -----------------------------------------------------
      var mapFiles = [];

      // JS version of Bangle.js's projection
      function bproject(lat, lon) {
        const degToRad = Math.PI / 180; // degree to radian conversion
        const latMax = 85.0511287798; // clip latitude to sane values
        const R = 6378137; // earth radius in m
        if (lat > latMax) lat=latMax;
        if (lat < -latMax) lat=-latMax;
        var s = Math.sin(lat * degToRad);
        return new L.Point(
          (R * lon * degToRad),
          (R * Math.log((1 + s) / (1 - s)) / 2)
        );
      }

      function loadTile(url) {
        return new Promise(function(resolve,reject) {
          var img = new Image();
          img.crossOrigin = "Anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Failed to load "+url));
          img.src = url;
        });
      }

      /* Draw OpenStreetMap tiles into ctx, filtered for the Bangle's screen.
      area = {zoom,x,y,width,height} in OpenStreetMap pixels at that zoom */
      function renderMap(ctx, area) {
        ctx.canvas.width = area.width;
        ctx.canvas.height = area.height;
        bangleTileLayer._tileZoom = area.zoom;
        var tileGetters = [];
        for (let tx = Math.floor(area.x / OSMTILESIZE); tx*OSMTILESIZE < area.x+area.width; tx++) {
          for (let ty = Math.floor(area.y / OSMTILESIZE); ty*OSMTILESIZE < area.y+area.height; ty++) {
            var coords = new L.Point(tx, ty);
            coords.z = area.zoom;
            tileGetters.push(loadTile(bangleTileLayer.getTileUrl(coords)).then(img => {
              ctx.drawImage(img, tx*OSMTILESIZE - area.x, ty*OSMTILESIZE - area.y, OSMTILESIZE, OSMTILESIZE);
            }));
          }
        }
        return Promise.all(tileGetters).then(() => {
          /* Go through all the data beforehand and
          turn the saturation up to maximum, so if thresholded to 3 bits it
          works a lot better */
          var imageData = ctx.getImageData(0,0,area.width,area.height);
          var dstData = ctx.createImageData(area.width, area.height);
          imageFilterFor3BPP(imageData, dstData, {});
          ctx.putImageData(dstData,0,0);
        });
      }

      // convert canvas into an actual tiled image file
      function tilesLoaded(ctx, width, height, mapImageFile) {
        var options = currentStyle.img; // compression options
        console.log("Compression options", options);
        var w = Math.round(width / TILESIZE);
        var h = Math.round(height / TILESIZE);
        var tiledImage;
        for (var y=0;y<h;y++) {
          for (var x=0;x<w;x++) {
            var imageData = ctx.getImageData(x*TILESIZE, y*TILESIZE, TILESIZE, TILESIZE);
            var rgba = imageData.data;
            options.rgbaOut = rgba;
            options.width = TILESIZE;
            options.height = TILESIZE;
            var imgstr = imageconverter.RGBAtoString(rgba, options);
            /*if (document.getElementById("preview").checked) {
              ctx.putImageData(imageData,x*TILESIZE, y*TILESIZE); // write preview
            }*/
            /*var compress = 'require("heatshrink").decompress('
            if (!imgstr.startsWith(compress)) throw "Data in wrong format";
            imgstr = imgstr.slice(compress.length,-1);*/
            if (tiledImage) tiledImage += imgstr.substr(3); // skip header
            else tiledImage = imgstr; // for first image, keep the header
          }
        }
        return [{
          name:mapImageFile,
          content:tiledImage
        }];
      }

      // Returns the files for a rendered map: [json, img]
      function createMapFiles(ctx, area, mapNumber, extraInfo) {
        var mapImageFile = `openstmap.${mapNumber}.img`;
        var files = tilesLoaded(ctx, area.width, area.height, mapImageFile);
        var center = map.unproject([area.x + area.width/2, area.y + area.height/2], area.zoom);
        // Work out scale factors (how much from Bangle.project does one pixel equate to?)
        var pc = map.unproject([area.x, area.y], area.zoom);
        var pd = map.unproject([area.x+1, area.y], area.zoom);
        var scale = bproject(pc.lat, pc.lng).distanceTo(bproject(pd.lat, pd.lng));
        files.unshift({name:`openstmap.${mapNumber}.json`,content:JSON.stringify(Object.assign({
          imgx : area.width,
          imgy : area.height,
          tilesize : TILESIZE,
          scale : scale, // how much of Bangle.project(latlon) does one pixel equate to?
          lat : center.lat,
          lon : center.lng,
          w : Math.round(area.width / TILESIZE), // width in tiles
          h : Math.round(area.height / TILESIZE), // height in tiles
          kBytes : Math.round(files[0].content.length/1000),
          fn : mapImageFile
        }, extraInfo))});
        return files;
      }

      function filesSizeInK(files) {
        return Math.round(files.reduce((r,m)=>m.content.length+r,0)/1000);
      }

      function freeMapNumbers(count) {
        var mapNumbers = [];
        for (var mapNumber = 0; mapNumbers.length < count; mapNumber++)
          if (!loadedMaps[mapNumber]) mapNumbers.push(mapNumber);
        return mapNumbers;
      }

      // ----------------------------------------------------- Storage space
      var STORAGE_FILE_OVERHEAD = 36; // Storage file header plus alignment padding
      var IMAGE_HEADER_SIZE = 3;
      var MAP_JSON_SIZE = 300; // upper bound of a map's JSON file

      // Bytes we can write - the Bangle compacts Storage by itself when needed
      function getStorageFree() {
        return new Promise(resolve => {
          Puck.eval(`require("Storage").getStats()`, stats => resolve(stats.freeBytes + stats.trashBytes));
        });
      }

      function estimateMapBytes(area) {
        var bpp = imageconverter.getFormats()[currentStyle.img.mode].bpp;
        var tiles = (area.width / TILESIZE) * (area.height / TILESIZE);
        return IMAGE_HEADER_SIZE + tiles*Math.ceil(TILESIZE*TILESIZE*bpp/8) + MAP_JSON_SIZE + 2*STORAGE_FILE_OVERHEAD;
      }

      function filesBytes(files) {
        return files.reduce((r,file) => r + file.content.length + STORAGE_FILE_OVERHEAD, 0);
      }

      function notEnoughSpaceMessage(bytes, free) {
        return `Not enough space on the watch: needs ${Math.round(bytes/1000)}k, ${Math.round(free/1000)}k free`;
      }

      document.getElementById("getmap").addEventListener("click", function() {
        var mapSize = TILESIZE*parseInt(document.getElementById("mapSize").value); // size of map we download to Bangle in pixels
        var zoom = map.getZoom();
        var center = map.project(map.getBounds().getCenter(), zoom).round();
        var area = { zoom : zoom, x : center.x - mapSize/2, y : center.y - mapSize/2, width : mapSize, height : mapSize };
        var canvas = document.getElementById("maptiles");
        canvas.style.display="";
        var ctx = canvas.getContext('2d');
        renderMap(ctx, area).then(() => {
          mapFiles = createMapFiles(ctx, area, freeMapNumbers(1)[0]);
          document.getElementById("uploadbuttons").style.display="";
          document.getElementById("mapstats").innerText = "Size : "+ (filesSizeInK(mapFiles)+"kb");
          console.log(mapFiles);
        });
      });

      // ----------------------------------------------------- Route
      var TILES_PER_ROUTE_MAP = 8; // maximum width and height of each map uploaded for a route
      var ROUTE_COLOR = "#f0f"; // pure 3 bit colour not used elsewhere by the app
      var ROUTE_WIDTH = 3;
      var route; // {name, segments} from the loaded GPX file
      var storageFree; // bytes free on the Bangle
      var routeLayer = L.layerGroup();
      var routeAreaLayer = L.layerGroup();

      function isRouteMode() {
        return document.getElementById("mapMode").value == "route";
      }

      function showMapMode() {
        var routeMode = isRouteMode();
        document.getElementById("areacontrols").style.display = routeMode ? "none" : "";
        document.getElementById("routecontrols").style.display = routeMode ? "" : "none";
        document.getElementById("routeoptions").style.display = routeMode && route ? "" : "none";
        document.getElementById("maptiles").style.display = "none";
        document.getElementById("uploadbuttons").style.display = "none";
        [routeLayer, routeAreaLayer].forEach(layer => routeMode ? layer.addTo(map) : map.removeLayer(layer));
        if (routeMode && route) map.fitBounds(route.bounds);
      }

      function routeAreas() {
        return RoutePlan.areasFor(route.segments, {
          zoom : parseInt(document.getElementById("routeDetail").value),
          radius : parseInt(document.getElementById("routeRadius").value),
          tileSize : TILESIZE,
          tilesPerArea : TILES_PER_ROUTE_MAP
        });
      }

      function areaBounds(area) {
        return L.latLngBounds(
          map.unproject([area.x, area.y], area.zoom),
          map.unproject([area.x + area.width, area.y + area.height], area.zoom));
      }

      function showRoutePlan() {
        if (!route) return;
        var areas = routeAreas();
        var bytes = areas.reduce((r,area) => r + estimateMapBytes(area), 0);
        var fits = bytes <= storageFree;
        routeAreaLayer.clearLayers();
        areas.forEach(area => L.rectangle(areaBounds(area), {weight:1, fill:false}).addTo(routeAreaLayer));
        document.getElementById("getroute").disabled = !fits;
        document.getElementById("routestats").innerText = fits ?
          `${areas.length} maps, ${Math.round(bytes/1000)}k of ${Math.round(storageFree/1000)}k free` :
          notEnoughSpaceMessage(bytes, storageFree) + " - lower the detail or narrow the route";
      }

      function drawRoute(ctx, area) {
        ctx.strokeStyle = ROUTE_COLOR;
        ctx.lineWidth = ROUTE_WIDTH;
        ctx.lineCap = ctx.lineJoin = "round";
        route.segments.forEach(segment => {
          ctx.beginPath();
          segment.forEach(pt => {
            var p = map.project([pt.lat, pt.lon], area.zoom);
            ctx.lineTo(p.x - area.x, p.y - area.y);
          });
          ctx.stroke();
        });
      }

      function loadRoute(file) {
        return Promise.all([file.text(), getStorageFree()]).then(([gpx, free]) => {
          var segments = gpxToSegments(new DOMParser().parseFromString(gpx, "application/xml"));
          if (!segments.length) throw new Error(`No track or route found in ${file.name}`);
          storageFree = free;
          route = {
            name : file.name.replace(/\.gpx$/i, "").replace(/[^\w\- ]/g, "_").substr(0, 24),
            segments : segments
          };
          routeLayer.clearLayers();
          route.bounds = L.polyline(segments.map(segment => segment.map(pt => [pt.lat, pt.lon])), {color:ROUTE_COLOR}).addTo(routeLayer).getBounds();
          showMapMode();
          showRoutePlan();
        });
      }

      document.getElementById("gpxFile").addEventListener("change", function(event) {
        var file = event.target.files[0];
        event.target.value = ""; // so the same file can be loaded again
        if (file) loadRoute(file).catch(err => alert(err.message));
      });

      document.getElementById("mapMode").addEventListener("change", showMapMode);
      document.getElementById("routeRadius").addEventListener("change", showRoutePlan);
      document.getElementById("routeDetail").addEventListener("change", showRoutePlan);

      document.getElementById("getroute").addEventListener("click", function() {
        var areas = routeAreas();
        var mapNumbers = freeMapNumbers(areas.length);
        var ctx = document.getElementById("maptiles").getContext('2d');
        var files = [];
        let promise = Promise.resolve();
        areas.forEach((area, i) => {
          promise = promise.then(() => {
            Util.showModal(`Downloading map ${i+1} of ${areas.length}...`);
            return renderMap(ctx, area);
          }).then(() => {
            drawRoute(ctx, area);
            files = files.concat(createMapFiles(ctx, area, mapNumbers[i], {route : route.name}));
          });
        });
        promise.then(() => {
          mapFiles = files;
          document.getElementById("uploadbuttons").style.display="";
          document.getElementById("mapstats").innerText = "Size : "+ (filesSizeInK(mapFiles)+"kb");
        }).catch(err => alert(err.message)).then(() => Util.hideModal());
      });

      document.getElementById("mapStyle").addEventListener("change", function() {
        var style = document.getElementById("mapStyle").value;
        if (!style in MAPSTYLES) return;
        map.removeLayer(previewTileLayer);
        createMapLayers(MAPSTYLES[style]);
        previewTileLayer.addTo(map);
        showRoutePlan();
      });

      document.getElementById("upload").addEventListener("click", function() {
        Util.showModal("Checking space...");
        let promise = getStorageFree().then(free => {
          if (filesBytes(mapFiles) > free) throw new Error(notEnoughSpaceMessage(filesBytes(mapFiles), free));
          Util.showModal("Uploading...");
        });
        mapFiles.forEach(file => {
          promise = promise.then(function() {
            return new Promise(resolve => {
              Util.writeStorage(file.name, file.content, resolve);
            });
          });
        });
        promise.then(function() {
          Util.hideModal();
          console.log("Upload Complete");
          showLoadedMaps();
        }).catch(err => {
          Util.hideModal();
          alert(err.message);
        });
      });

      document.getElementById("cancel").addEventListener("click", function() {
        showMap();
      });

    </script>
  </body>
</html>
