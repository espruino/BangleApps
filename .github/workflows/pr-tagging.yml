name: Tag app authors

on:
  # not pull_request, so PRs from forks get a write-capable token
  # and can be commented on by this workflow
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-tagging-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mention-app-authors:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target -> base branch checked out (rather than PR)
      - uses: actions/checkout@v4
        with:
          # full history, so the diff against the base branch works
          fetch-depth: 0

      - name: Fetch PR head (not checked out)
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: git fetch origin "+refs/pull/${PR_NUM}/head:refs/remotes/pr/head"

      - name: Tag app authors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

        # This runs with a privileged token, so it must never
        # check out or execute code from the PR - we checkout
        # the base branch
        run: node bin/pr-tag.js "origin/${BASE_REF}...refs/remotes/pr/head"
