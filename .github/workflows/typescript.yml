name: Update typescript bindings

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 4"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout BangleApps
        uses: actions/checkout@v4
        with:
          path: BangleApps
          fetch-depth: 1

      - name: Checkout Espruino
        uses: actions/checkout@v4
        with:
          repository: espruino/Espruino
          path: Espruino

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate typescript
        run: |
          cd Espruino
          node ./scripts/build_types.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          path: BangleApps
          add-paths: typescript/types
          branch: typescript/update
          delete-branch: true
          commit-message: "bot: update generated typescript"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "bot: update generated typescript"
          body: |
            This PR was automatically generated by the
            [typescript workflow](../actions/workflows/typescript.yml)
            from `scripts/build_types.js` in [espruino/Espruino](https://github.com/espruino/Espruino).
          labels: bot
